<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Intérprete en vivo</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:#111; color:#eee; }
  header { padding:6px 12px; background:#000; font-size:14px; display:flex; align-items:center; gap:8px; }
  header .titulo { font-weight:600; }
  header .sp { margin-left:auto; }
  header button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:13px; }
  header button:hover { background:#333; }
  header button.cortar { background:#c0392b; border-color:#e74c3c; font-weight:600; }
  header button.cortar:hover { background:#e74c3c; }
  header button.cortar:active, header button.cortar.flash { background:#ff6b5b; transform:scale(0.96); }
  header button.poder-off { background:#14512a; border-color:#2ecc71; font-weight:600; animation:late 1.6s infinite; }
  @keyframes late { 50% { background:#1e7a3f; } }
  body.pausada .grid { opacity:.35; }
  .grid { display:grid; grid-template-columns:1fr 1fr; height:calc(100vh - 36px); }
  .panel { display:flex; flex-direction:column; overflow:hidden; border-left:1px solid #333; }
  .panel h2 { margin:0; padding:6px 10px; font-size:14px; background:#1b1b1b; }
  .es h2 { background:#14331f; } .en h2 { background:#142033; }
  .feed { overflow-y:auto; padding:8px; flex:1; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px 4px; border-bottom:1px solid #222; }
  .orig { color:#bbb; } .trad { color:#fff; font-weight:600; }
  .hora { font-size:11px; color:#666; }
  .nuevo { animation:flash 1s; }
  .row.parcial { opacity:.55; font-style:italic; border-bottom:1px dashed #555; }
  @keyframes flash { from { background:#3a3a00; } to { background:transparent; } }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; margin:2px 2px 0 0; }
  .numero{background:#553;} .direccion{background:#355;} .nombre{background:#535;} .fecha{background:#544;}
  .retrad { background:#4a3000; color:#fc6; border:1px solid #a60; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; font-weight:400; }
  .retrad:hover { background:#5c3c00; }
  .sintrad { color:#fc6; font-size:12px; font-weight:400; }
  .trad .w { cursor:pointer; border-bottom:1px dotted #777; }
  .trad .w:hover, .trad .w.activo { color:#9cf; }
  .pron { color:#7d7; font-style:normal; font-weight:400; }
  /* historial */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:10; }
  .modal-card { background:#1a1a1a; width:min(900px,92vw); height:min(80vh,90vh); border:1px solid #444; border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#000; }
  .modal-body { overflow-y:auto; padding:10px; flex:1; }
  .modal button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:3px 9px; cursor:pointer; }
  .modal button:hover { background:#333; }
  .hist-top { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding:9px 6px; border-bottom:1px solid #2a2a2a; }
  .hist-item .abrir { cursor:pointer; flex:1; }
  .hist-item .abrir:hover { color:#9cf; }
  .solo-lectura { font-size:11px; color:#999; border:1px solid #444; border-radius:8px; padding:1px 6px; }
  .vacio { color:#888; text-align:center; margin-top:40px; }
  /* notas flotantes */
  #notas { display:none; position:fixed; right:16px; bottom:16px; width:300px; height:260px; background:#1a1a1a; border:1px solid #555; border-radius:10px; flex-direction:column; z-index:9; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  #notas .nh { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#000; border-radius:10px 10px 0 0; cursor:move; user-select:none; }
  #notas .nh button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 8px; cursor:pointer; }
  #notas textarea { flex:1; background:#111; color:#eee; border:none; padding:10px; resize:none; font:14px system-ui,sans-serif; outline:none; border-radius:0 0 10px 10px; }
  /* deletreo (alfabeto fonético OTAN) */
  #deletreo { display:none; position:fixed; left:16px; bottom:16px; width:320px; max-height:70vh; background:#1a1a1a; border:1px solid #555; border-radius:10px; flex-direction:column; z-index:9; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  #deletreo .nh { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#000; border-radius:10px 10px 0 0; cursor:move; user-select:none; }
  #deletreo .nh button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 8px; cursor:pointer; }
  #deletreo input { margin:8px; padding:7px 9px; background:#111; color:#eee; border:1px solid #444; border-radius:6px; font:15px system-ui,sans-serif; outline:none; }
  #del-out { overflow-y:auto; padding:0 10px 10px; }
  .drow { padding:4px 2px; border-bottom:1px solid #222; font-size:15px; letter-spacing:.3px; }
  .drow b { display:inline-block; min-width:1.4em; color:#9cf; }
  .dn { color:#888; } .do { color:#fff; font-weight:600; } .dp { color:#7d7; }
  #del-out .vacio2 { color:#888; display:block; padding:8px 2px; }
  .vacio2 { color:#888; }
  /* ajustes: consumo por API DeepL */
  #ajustes { display:none; position:fixed; right:16px; top:48px; width:340px; background:#1a1a1a; border:1px solid #555; border-radius:10px; flex-direction:column; z-index:9; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  #ajustes .nh { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#000; border-radius:10px 10px 0 0; cursor:move; user-select:none; }
  #ajustes .nh button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 8px; cursor:pointer; }
  .aj-body { padding:10px; overflow-y:auto; max-height:60vh; }
  .aj-body h3 { margin:0 0 10px; font-size:13px; color:#bbb; font-weight:600; }
  .aj-api { margin-bottom:12px; font-size:13px; }
  .aj-api .bar { height:8px; background:#333; border-radius:4px; overflow:hidden; margin:4px 0 2px; }
  .aj-api .bar i { display:block; height:100%; }
  .aj-nums { color:#999; font-size:12px; }
  .aj-tope { color:#f66; font-size:12px; font-weight:600; }
  #alerta-api { display:none; color:#f66; font-weight:600; cursor:pointer; }
  /* ayudas dentro de Notas (días/meses y números) */
  .ayuda { display:none; overflow-y:auto; max-height:300px; border-bottom:1px solid #333; padding:6px 10px; }
  .ayuda h4 { margin:6px 0 2px; font-size:12px; color:#9cf; text-transform:uppercase; letter-spacing:.5px; }
  .ayuda .drow b { min-width:6.2em; }
  #num-in, #tiempo-in { width:calc(100% - 20px); margin:0 0 6px; padding:6px 8px; background:#111; color:#eee; border:1px solid #444; border-radius:6px; font:14px system-ui,sans-serif; outline:none; box-sizing:border-box; }
  .ttot { background:#111; border:1px solid #333; border-radius:8px; padding:6px 9px; margin-bottom:8px; font-size:13px; }
  .ttot b { color:#9cf; }
  .ttot .tdia { display:flex; justify-content:space-between; color:#999; font-size:12px; padding:1px 0; }
  .ttot .tdia span:last-child { color:#ccc; }
  .trow { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:4px 2px; border-bottom:1px solid #222; font-size:13px; }
  .trow .tf { color:#888; font-size:11px; white-space:nowrap; }
  .trow button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:1px 6px; cursor:pointer; }
  #notas.grande { height:500px; }
</style>
</head>
<body>
<header>
  <span class="titulo">Intérprete en vivo</span>
  <button id="btn-poder" onclick="togglePoder()" title="Apagar/encender la transcripción: apagado no gasta GPU ni cuota de DeepL (ideal para ver videos en tiempo muerto)">⏻ Apagar</button>
  <button id="btn-cortar" class="cortar" onclick="cortar()" title="Mostrar YA la frase actual (atajo: barra espaciadora)">✂️ Mostrar ya</button>
  <button id="btn-motor" onclick="toggleMotor()" title="Cambiar entre motor preciso (más lento) y rápido (menos preciso)">🎯 Preciso</button>
  <button onclick="limpiar()" title="Archiva la conversación actual en el historial y limpia la pantalla">🧹 Limpiar</button>
  <button onclick="abrirHist()" title="Ver conversaciones guardadas">🕘 Historial</button>
  <button onclick="toggleNotas()" title="Bloc de notas para apuntar nombres/datos">📝 Notas</button>
  <button onclick="toggleDeletreo()" title="Deletrear una palabra en alfabeto fonético (OTAN) para el representante">🔤 Deletrear</button>
  <button onclick="toggleAjustes()" title="Consumo de cada API de DeepL">⚙ Ajustes</button>
  <span class="sp"></span>
  <span id="alerta-api" onclick="toggleAjustes()" title="Una API llegó a su límite — clic para ver el detalle"></span>
  <span id="cuota" title="Caracteres DeepL usados este mes (todas las APIs sumadas)"></span>
  <span id="estado">conectando…</span>
</header>
<div class="grid">
  <section class="panel es"><h2>🇪🇸 Cliente (español) — original · interpretación</h2><div class="feed" id="feed-es"></div></section>
  <section class="panel en"><h2>🇺🇸 Representante (inglés) — original · interpretación</h2><div class="feed" id="feed-en"></div></section>
</div>

<div id="notas">
  <div class="nh"><b>📝 Notas</b><span><button onclick="toggleAyuda('tiempos')" title="Registro de tiempos en llamada">⏱</button> <button onclick="toggleAyuda('dias')" title="Días y meses en inglés, con traducción y pronunciación">📅</button> <button onclick="toggleAyuda('nums')" title="Cómo se dice y pronuncia un número en inglés">🔢</button> <button onclick="borrarNotas()">🗑 Borrar</button> <button onclick="toggleNotas()">✕</button></span></div>
  <div id="ayuda-tiempos" class="ayuda">
    <input id="tiempo-in" placeholder="Ej: 23 min llamada clínica — Enter guarda" autocomplete="off" spellcheck="false">
    <div id="tiempo-out"></div>
  </div>
  <div id="ayuda-dias" class="ayuda"></div>
  <div id="ayuda-nums" class="ayuda">
    <input id="num-in" placeholder="Número: 1985, 2500000, 916-680-4101…" oninput="verNumero()" autocomplete="off" spellcheck="false">
    <div id="num-out"></div>
  </div>
  <textarea id="notas-txt" placeholder="Apunta aquí nombres y datos para corroborar…"></textarea>
</div>

<div id="ajustes">
  <div class="nh"><b>⚙ Ajustes</b><span><button onclick="toggleAjustes()">✕</button></span></div>
  <div class="aj-body"><h3>Consumo DeepL por API (mes)</h3><div id="aj-apis"><span class="vacio2">Sin datos aún — llegan al conectar…</span></div></div>
</div>

<div id="deletreo">
  <div class="nh"><b>🔤 Deletrear</b><span><button onclick="verAlfabeto()">🔡 Ver A-Z</button> <button onclick="toggleDeletreo()">✕</button></span></div>
  <input id="del-in" placeholder="Escribe una palabra…" oninput="deletrear()" autocomplete="off" spellcheck="false">
  <div id="del-out"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>🕘 Historial de conversaciones</b><button onclick="cerrarHist()">✕</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script>
const KEY = "interprete_historial";
const estado = document.getElementById("estado");
const cuota = document.getElementById("cuota");
const feedEs = document.getElementById("feed-es");
const feedEn = document.getElementById("feed-en");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modal-body");
let sesion = [];  // intervenciones de la sesión EN VIVO (lo que llega va siempre aquí)
let ws = null;
const pronCache = {};   // palabra(min) -> pronunciación, para no re-pedir
const pendientes = {};  // palabra(min) -> [spans esperando respuesta]

function chips(res){
  return (res||[]).map(r => `<span class="chip ${r.tipo}">${r.texto}</span>`).join("");
}
function clicable(texto){  // envuelve cada palabra para poder pedir su pronunciación
  return texto.replace(/[A-Za-z][A-Za-z']*/g, w => `<span class="w" onclick="pronunciar(this)">${w}</span>`);
}
function tradHTML(iv){
  // La interpretación al inglés (cuando el original es español) lleva palabras clicables.
  return (iv.idioma === "es" ? clicable(iv.traduccion) : iv.traduccion) + "<br>" + chips(iv.resaltados);
}
function rowHTML(iv, bandera, i){
  const h = (bandera ? (iv.idioma === "es" ? "🇪🇸 " : "🇺🇸 ") : "") + iv.hora;
  // Sin traducción (fallaron DeepL y el respaldo): en vivo, botón para reintentar;
  // en el historial (solo lectura, sin índice), solo la marca.
  const cuerpo = (iv.traduccion || "").trim() ? tradHTML(iv)
      : i == null ? `<span class="sintrad">⚠ sin traducción</span>`
      : `<button class="retrad" onclick="reintentar(${i}, this)">⚠ reintentar traducción</button>`;
  return `<div class="row"${i == null ? "" : ` id="row-${i}"`}><div class="orig"><span class="hora">${h}</span><br>${iv.original}</div>`
       + `<div class="trad"${i == null ? "" : ` id="trad-${i}"`}>${cuerpo}</div></div>`;
}
function reintentar(i, btn){
  if(!ws || ws.readyState !== 1) return;
  btn.disabled = true;
  btn.textContent = "⏳ traduciendo…";
  ws.send(JSON.stringify({ tipo: "retrad", i, original: sesion[i].original, idioma: sesion[i].idioma }));
}
function recibirRetrad(m){
  const iv = sesion[m.i], celda = document.getElementById("trad-" + m.i);
  if(!iv || !celda) return;
  if(!(m.traduccion || "").trim()){  // volvió a fallar: dejar reintentar de nuevo
    const b = celda.querySelector("button.retrad");
    if(b){ b.disabled = false; b.textContent = "⚠ reintentar traducción"; }
    return;
  }
  iv.traduccion = m.traduccion;
  iv.resaltados = m.resaltados || [];
  celda.innerHTML = tradHTML(iv);  // sesion ya quedó al día: el historial la guarda bien
}
function mostrarPron(el, pron){
  const tag = document.createElement("i");
  tag.className = "pron";
  tag.textContent = pron ? ` "${pron}"` : " (?)";
  el.after(tag);
  el._pron = tag;
}
function pronunciar(el){
  if(el.classList.contains("activo")){  // segundo clic: ocultar
    el.classList.remove("activo");
    if(el._pron){ el._pron.remove(); el._pron = null; }
    return;
  }
  el.classList.add("activo");
  const w = el.textContent.toLowerCase();
  if(w in pronCache){ mostrarPron(el, pronCache[w]); return; }
  (pendientes[w] = pendientes[w] || []).push(el);
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "pron", palabra: el.textContent }));
}
function recibirPron(m){
  const w = (m.palabra || "").toLowerCase();
  pronCache[w] = m.pron;
  (pendientes[w] || []).forEach(el => { if(el.classList.contains("activo") && !el._pron) mostrarPron(el, m.pron); });
  pendientes[w] = [];
}
// --- caption provisional (en vivo, se reemplaza por la versión final) ---
function limpiarParciales(fin){
  document.querySelectorAll(".row.parcial").forEach(el => el.remove());
  if(fin) ultTradParcial = "";  // frase cerrada: la traducción vieja ya no aplica
}
let ultTradParcial = "";  // la traducción llega ~0.5s después del original: mientras, mostramos la anterior
function verParcial(m){
  if(!m.original) return;
  if(m.traduccion) ultTradParcial = m.traduccion;
  limpiarParciales();  // solo hay un hablante a la vez; un único parcial activo
  const feed = m.idioma === "es" ? feedEs : feedEn;
  feed.insertAdjacentHTML("beforeend",
    `<div class="row parcial"><div class="orig"><span class="hora">✏️ en vivo…</span><br>${m.original}</div>`
    + `<div class="trad">${m.traduccion || ultTradParcial || "…"}</div></div>`);
  feed.scrollTop = feed.scrollHeight;
}
let ultFila = { es: null, en: null };  // índice en sesion de la última fila final por idioma
function add(iv){
  limpiarParciales(true);
  const feed = iv.idioma === "es" ? feedEs : feedEn;
  const prev = ultFila[iv.idioma];
  // continuación de la misma idea: la fila anterior se reemplaza por el hilo completo
  // re-traducido (así los fragmentos cortados por el silencio conectan bien).
  if(iv.continuar && prev != null && document.getElementById("row-" + prev)){
    sesion[prev] = iv;
    document.getElementById("row-" + prev).outerHTML = rowHTML(iv, false, prev);
    document.getElementById("row-" + prev).classList.add("nuevo");
  } else {
    sesion.push(iv);
    ultFila[iv.idioma] = sesion.length - 1;
    feed.insertAdjacentHTML("beforeend", rowHTML(iv, false, sesion.length - 1));
    feed.lastElementChild.classList.add("nuevo");
  }
  feed.scrollTop = feed.scrollHeight;
}
function verUso(u){
  if(!u.limit){ cuota.textContent = ""; return; }
  const pct = Math.round(u.count / u.limit * 100);
  cuota.textContent = `DeepL ${u.count.toLocaleString()}/${u.limit.toLocaleString()} (${pct}%)`;
  cuota.style.color = pct >= 90 ? "#f66" : pct >= 70 ? "#fc6" : "#6c6";
  verApis(u.cuentas || []);
}
// --- ajustes: consumo por API DeepL + alerta si alguna llegó a su límite ---
const alertaApi = document.getElementById("alerta-api");
const ajApis = document.getElementById("aj-apis");
function verApis(cuentas){
  if(cuentas.length){
    ajApis.innerHTML = cuentas.map(c => {
      if(!c.limit) return `<div class="aj-api"><b>${c.nombre}</b> — <span class="aj-tope">sin datos (¿key inválida o sin red?)</span></div>`;
      const pct = Math.min(100, Math.round(c.count / c.limit * 100));
      const color = pct >= 90 ? "#f66" : pct >= 70 ? "#fc6" : "#6c6";
      const tope = c.count >= c.limit ? ` <span class="aj-tope">⛔ AL LÍMITE — no se usará hasta que recargue</span>` : "";
      return `<div class="aj-api"><b>${c.nombre}</b>${tope}<div class="bar"><i style="width:${pct}%;background:${color}"></i></div>`
           + `<span class="aj-nums">${c.count.toLocaleString()} / ${c.limit.toLocaleString()} (${pct}%)</span></div>`;
    }).join("");
  }
  const tope = cuentas.filter(c => c.limit && c.count >= c.limit);
  alertaApi.style.display = tope.length ? "inline" : "none";
  alertaApi.textContent = tope.length ? `⚠ ${tope.map(c => c.nombre).join(", ")} al límite` : "";
}
function toggleAjustes(){
  const a = document.getElementById("ajustes");
  a.style.display = a.style.display === "flex" ? "none" : "flex";
}

// --- historial (todo en localStorage; el visor es solo lectura) ---
function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function guardar(h){ localStorage.setItem(KEY, JSON.stringify(h)); }
function limpiar(){
  if(sesion.length){
    const h = cargar();
    h.unshift({ id: Date.now(), fecha: new Date().toLocaleString("es"), n: sesion.length, ivs: sesion });
    guardar(h);
  }
  sesion = [];
  ultFila = { es: null, en: null };
  feedEs.innerHTML = ""; feedEn.innerHTML = "";
}
function abrirHist(){ modal.style.display = "flex"; listaHist(); }
function cerrarHist(){ modal.style.display = "none"; }
function listaHist(){
  const h = cargar();
  if(!h.length){ modalBody.innerHTML = "<p class='vacio'>No hay conversaciones guardadas.</p>"; return; }
  modalBody.innerHTML =
    `<div class="hist-top"><button onclick="borrarTodo()">🗑 Borrar todo</button></div>` +
    h.map(c => `<div class="hist-item"><span class="abrir" onclick="verHist(${c.id})">📄 ${c.fecha} — ${c.n} intervenciones</span>`
             + `<button onclick="borrarUno(${c.id})">🗑</button></div>`).join("");
}
function verHist(id){
  const c = cargar().find(x => x.id === id);
  if(!c) return;
  modalBody.innerHTML =
    `<div class="hist-top"><button onclick="listaHist()">← Volver</button> <b>${c.fecha}</b> <span class="solo-lectura">solo lectura</span></div>`
    + c.ivs.map(iv => rowHTML(iv, true)).join("");
}
function borrarUno(id){ guardar(cargar().filter(x => x.id !== id)); listaHist(); }
function borrarTodo(){ if(confirm("¿Borrar TODO el historial guardado?")){ localStorage.removeItem(KEY); listaHist(); } }

const btnCortar = document.getElementById("btn-cortar");
function cortar(){  // tijera: pide procesar la frase actual ya, sin esperar el silencio
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "cortar" }));
  btnCortar.classList.add("flash");
  setTimeout(() => btnCortar.classList.remove("flash"), 200);
}
const btnPoder = document.getElementById("btn-poder");
function togglePoder(){
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "poder" }));
}
function verPoder(m){
  btnPoder.textContent = m.on ? "⏻ Apagar" : "▶️ Encender";
  btnPoder.classList.toggle("poder-off", !m.on);
  document.body.classList.toggle("pausada", !m.on);
  estado.textContent = m.on ? "● en vivo" : "⏸ apagado — no gasta nada";
  if(!m.on) limpiarParciales();
}
const btnMotor = document.getElementById("btn-motor");
function toggleMotor(){
  if(ws && ws.readyState === 1){
    btnMotor.textContent = "⏳ cambiando…";  // la 1ª carga del modelo tarda unos segundos
    ws.send(JSON.stringify({ tipo: "motor" }));
  }
}
function verMotor(m){
  btnMotor.textContent = m.modo === "rapido" ? "⚡ Rápido" : "🎯 Preciso";
}
document.addEventListener("keydown", e => {  // barra espaciadora = tijera

// Hace movible una ventana flotante arrastrándola por su cabecera (.nh) y recuerda
// su posición en localStorage. REGLA: toda ventana flotante nueva debe llamar a esto.
function hacerMovible(win, clave){
  // Restaurar solo posiciones numéricas y siempre dentro de la pantalla; una posición
  // vacía o fuera de vista dejaba el panel "abierto" pero invisible.
  const pos = JSON.parse(localStorage.getItem(clave) || "null");
  const l = parseFloat(pos && pos.left), t = parseFloat(pos && pos.top);
  if(!isNaN(l) && !isNaN(t)){
    Object.assign(win.style, { left:Math.min(Math.max(l,0),innerWidth-80)+"px",
                               top:Math.min(Math.max(t,0),innerHeight-40)+"px", right:"auto", bottom:"auto" });
  }
  let d = null;
  win.querySelector(".nh").addEventListener("mousedown", e => {
    if(e.target.tagName === "BUTTON") return;  // los botones no arrastran
    d = { x: e.clientX, y: e.clientY, left: win.offsetLeft, top: win.offsetTop };
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if(!d) return;
    Object.assign(win.style, { left:(d.left+e.clientX-d.x)+"px", top:(d.top+e.clientY-d.y)+"px", right:"auto", bottom:"auto" });
  });
  document.addEventListener("mouseup", () => {
    if(!d) return;
    d = null;
    // solo guardar si de verdad se arrastró; un click en la cabecera dejaba left/top vacíos
    if(win.style.left) localStorage.setItem(clave, JSON.stringify({ left:win.style.left, top:win.style.top, right:"auto", bottom:"auto" }));
  });
}
hacerMovible(notas, "interprete_notas_pos");

hacerMovible(document.getElementById("ajustes"), "interprete_ajustes_pos");

// --- registro de tiempos en llamada (⏱): entradas manuales con fecha/hora
// automáticas, persistidas en localStorage; cada una se borra con su 🗑.
const TIEMPOS_KEY = "interprete_tiempos";
const tiempoIn = document.getElementById("tiempo-in");
const tiempoOut = document.getElementById("tiempo-out");
function cargarTiempos(){ try { return JSON.parse(localStorage.getItem(TIEMPOS_KEY)) || []; } catch { return []; } }
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// minutos a partir del texto libre: "14:3"→14m3s (min:seg, como los anota Kenny),
// "2h"→120, "1h 20min"→140, "23 min"→23; un número pelado se toma como minutos.
function minutosDe(texto){
  const t = texto.toLowerCase();
  let m, min = 0;
  if(m = t.match(/(\d+)\s*:\s*([0-5]?\d)\b/)) return +m[1] + +m[2] / 60;
  if(m = t.match(/(\d+(?:[.,]\d+)?)\s*h(?:oras?|rs?)?\b/)) min += Math.round(parseFloat(m[1].replace(",", ".")) * 60);
  if(m = t.match(/(\d+)\s*m(?:in(?:utos?)?)?\b/)) min += +m[1];
  if(!min && (m = t.match(/\d+/))) min = +m[0];
  return min;
}
function fmtMin(n){ n = Math.round(n); return n >= 60 ? `${Math.floor(n / 60)}h ${n % 60}m` : `${n} min`; }
function totalesHTML(ts){
  const dia0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
  const hoy = dia0(Date.now());
  const lunes = new Date(hoy); lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
  const mes = new Date(); mes.setDate(1); const mes0 = dia0(mes);
  let hoyMin = 0, hoyN = 0, semMin = 0, mesMin = 0;
  const porDia = new Map();
  for(const t of ts){
    const min = minutosDe(t.texto), d = dia0(t.id);
    if(d === hoy){ hoyMin += min; hoyN++; }
    if(d >= lunes.getTime()) semMin += min;
    if(d >= mes0) mesMin += min;
    const p = porDia.get(d) || { min: 0, n: 0 };
    p.min += min; p.n++; porDia.set(d, p);
  }
  const dias = [...porDia].filter(([d]) => d !== hoy).sort((a, b) => b[0] - a[0]).slice(0, 10)
    .map(([d, p]) => `<div class="tdia"><span>${new Date(d).toLocaleDateString("es", { weekday: "short", day: "2-digit", month: "2-digit" })} (${p.n})</span><span>${fmtMin(p.min)}</span></div>`).join("");
  return `<div class="ttot"><b>Hoy: ${fmtMin(hoyMin)}</b> (${hoyN} llamada${hoyN === 1 ? "" : "s"})`
       + ` · Semana: ${fmtMin(semMin)} · Mes: ${fmtMin(mesMin)}${dias ? "<hr style='border-color:#333;margin:5px 0'>" + dias : ""}</div>`;
}
function verTiempos(){
  const ts = cargarTiempos();
  tiempoOut.innerHTML = totalesHTML(ts) + (ts.length
    ? ts.map(t => `<div class="trow"><span>📞 ${esc(t.texto)}</span>`
        + `<span class="tf">${t.fecha}</span><button onclick="borrarTiempo(${t.id})" title="Borrar esta entrada">🗑</button></div>`).join("")
    : "<span class='vacio2'>Sin tiempos aún — escribe arriba y Enter…</span>");
}
function borrarTiempo(id){
  localStorage.setItem(TIEMPOS_KEY, JSON.stringify(cargarTiempos().filter(t => t.id !== id)));
  verTiempos();
}
tiempoIn.addEventListener("keydown", e => {
  if(e.key !== "Enter" || !tiempoIn.value.trim()) return;
  const ts = cargarTiempos();
  ts.unshift({ id: Date.now(), texto: tiempoIn.value.trim(),
               fecha: new Date().toLocaleString("es", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) });
  localStorage.setItem(TIEMPOS_KEY, JSON.stringify(ts));
  tiempoIn.value = "";
  verTiempos();
});

// --- números → inglés hablado. Vocabulario cerrado: la pronunciación sale de tabla.
const UNIDADES = ["zero","one","two","three","four","five","six","seven","eight","nine",
  "ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen",
  "eighteen","nineteen"];
const DECENAS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const PRON_NUM = { zero:"SÍ-rou", one:"uán", two:"tu", three:"zrí", four:"fóar", five:"fáiv",
  six:"siks", seven:"SÉ-ven", eight:"éit", nine:"náin", ten:"ten", eleven:"i-LÉ-ven",
  twelve:"tuélv", thirteen:"zir-TÍN", fourteen:"for-TÍN", fifteen:"fif-TÍN",
  sixteen:"siks-TÍN", seventeen:"se-ven-TÍN", eighteen:"ei-TÍN", nineteen:"nain-TÍN",
  twenty:"TUÉN-ti", thirty:"ZÉR-ti", forty:"FÓR-ti", fifty:"FÍF-ti", sixty:"SÍKS-ti",
  seventy:"SÉ-ven-ti", eighty:"ÉI-ti", ninety:"NÁIN-ti", hundred:"JÁN-dred",
  thousand:"ZÁU-send", million:"MÍ-lion", billion:"BÍ-lion", oh:"óu", point:"póint" };
function centenas(n){  // 0-999 → palabras
  const out = [];
  if(n >= 100){ out.push(UNIDADES[Math.floor(n / 100)], "hundred"); n %= 100; }
  if(n >= 20){ out.push(DECENAS[Math.floor(n / 10)]); n %= 10; }
  if(n > 0) out.push(UNIDADES[n]);
  return out;
}
function enPalabras(n){
  if(n === 0) return ["zero"];
  let out = [];
  for(const [v, nombre] of [[1e9,"billion"],[1e6,"million"],[1e3,"thousand"],[1,""]]){
    if(n >= v){ out = out.concat(centenas(Math.floor(n / v))); if(nombre) out.push(nombre); n %= v; }
  }
  return out;
}
function comoAnio(n){  // lectura de año: 1985 → nineteen eighty-five; 2026 → twenty twenty-six
  if(n < 1100 || n > 2999 || (n >= 2000 && n < 2010)) return null;  // 2005 se lee normal
  const b = n % 100;
  return centenas(Math.floor(n / 100)).concat(
    b === 0 ? ["hundred"] : b < 10 ? ["oh", UNIDADES[b]] : centenas(b));
}
const numIn = document.getElementById("num-in");
const numOut = document.getElementById("num-out");
function filaNum(titulo, ws){
  return `<div class="drow"><span class="dn">${titulo}:</span> <span class="do">${ws.join(" ")}</span>`
       + `<br><span class="dp">(${ws.map(w => PRON_NUM[w] || w).join(" ")})</span></div>`;
}
function verNumero(){
  const raw = numIn.value.trim(), out = [];
  const limpio = raw.replace(/[,\s]/g, "");
  if(/^\d+(\.\d+)?$/.test(limpio)){
    const [ent, dec] = limpio.split(".");
    const n = parseInt(ent, 10);
    if(n <= 999999999999){
      let ws = enPalabras(n);
      if(dec) ws = ws.concat(["point"], [...dec].map(d => UNIDADES[+d]));
      out.push(filaNum("Se dice", ws));
      const anio = comoAnio(n);
      if(anio && !dec) out.push(filaNum("Como año/fecha", anio));
      if(!dec && ent.length >= 7)  // teléfonos/SSN sin guiones: también dígito a dígito
        out.push(filaNum("Dígito a dígito", [...ent].map(d => UNIDADES[+d])));
    }
  } else if(/^[\d\s().+-]+$/.test(raw) && /\d/.test(raw)){  // 916-680-4101 y similares
    out.push(filaNum("Dígito a dígito", [...raw].filter(c => /\d/.test(c)).map(d => UNIDADES[+d])));
  }
  numOut.innerHTML = out.length ? out.join("") : "<span class='vacio2'>Escribe un número…</span>";
}
// --- deletreo: alfabeto fonético OTAN (letra → nombre inglés → palabra → pronunciación es) ---
const ALFA = {
  A:["Ei","Alpha","Ál-fa"], B:["Bi","Bravo","Brá-vo"], C:["Si","Charlie","Chár-li"],
  D:["Di","Delta","Dél-ta"], E:["Íi","Echo","É-ko"], F:["Ef","Foxtrot","Fóks-trot"],
  G:["Yi","Golf","Golf"], H:["Eich","Hotel","Jo-tél"], I:["Ai","India","Ín-di-a"],
  J:["Yei","Juliett","Yú-li-et"], K:["Kei","Kilo","Ki-lo"], L:["El","Lima","Li-ma"],
  M:["Em","Mike","Máik"], N:["En","November","No-vém-ber"], O:["Ou","Oscar","Ós-kar"],
  P:["Pi","Papa","Pa-pá"], Q:["Kiu","Quebec","Ke-bék"], R:["Ar","Romeo","Ró-mi-ou"],
  S:["Es","Sierra","Si-é-rra"], T:["Ti","Tango","Tán-go"], U:["Yu","Uniform","Yú-ni-form"],
  V:["Vi","Victor","Vik-tor"], W:["Dáboliu","Whiskey","Uis-ki"], X:["Eks","X-ray","Éks-réi"],
  Y:["Uai","Yankee","Yán-ki"], Z:["Zi/Zed","Zulu","Zú-lu"]
};
const delOut = document.getElementById("del-out");
const delIn = document.getElementById("del-in");
function filaAlfa(L){
  const [n, otan, pron] = ALFA[L];
  return `<div class="drow"><b>${L}</b> <span class="dn">${n}</span> → <span class="do">${otan}</span> <span class="dp">(${pron})</span></div>`;
}
function deletrear(){
  const letras = [...delIn.value.toUpperCase()].filter(c => ALFA[c]);  // ignora espacios/acentos/símbolos
  delOut.innerHTML = letras.length ? letras.map(filaAlfa).join("")
                                   : "<span class='vacio2'>Escribe una palabra…</span>";
}
function verAlfabeto(){ delOut.innerHTML = Object.keys(ALFA).map(filaAlfa).join(""); }
function toggleDeletreo(){
  const d = document.getElementById("deletreo");
  d.style.display = d.style.display === "flex" ? "none" : "flex";
  if(d.style.display === "flex"){ deletrear(); delIn.focus(); }
}

function connect(){
  ws = new WebSocket("ws://localhost:8765");
  ws.onopen = () => estado.textContent = "● en vivo";
  ws.onclose = () => { estado.textContent = "desconectado, reintentando…"; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.tipo === "uso") verUso(m);
    else if(m.tipo === "pron") recibirPron(m);
    else if(m.tipo === "motor") verMotor(m);
    else if(m.tipo === "retrad") recibirRetrad(m);
    else if(m.tipo === "parcial") verParcial(m);
    else if(m.tipo === "parcial_fin") limpiarParciales(true);
    else if(m.tipo === "poder") verPoder(m);
    else add(m);
  };
}
