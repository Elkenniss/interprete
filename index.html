<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Intérprete en vivo</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:#111; color:#eee; }
  header { padding:6px 12px; background:#000; font-size:14px; display:flex; align-items:center; gap:8px; }
  header .titulo { font-weight:600; }
  header .sp { margin-left:auto; }
  header button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:13px; }
  header button:hover { background:#333; }
  header button.cortar { background:#c0392b; border-color:#e74c3c; font-weight:600; }
  header button.cortar:hover { background:#e74c3c; }
  header button.cortar:active, header button.cortar.flash { background:#ff6b5b; transform:scale(0.96); }
  .grid { display:grid; grid-template-columns:1fr 1fr; height:calc(100vh - 36px); }
  .panel { display:flex; flex-direction:column; overflow:hidden; border-left:1px solid #333; }
  .panel h2 { margin:0; padding:6px 10px; font-size:14px; background:#1b1b1b; }
  .es h2 { background:#14331f; } .en h2 { background:#142033; }
  .feed { overflow-y:auto; padding:8px; flex:1; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px 4px; border-bottom:1px solid #222; }
  .orig { color:#bbb; } .trad { color:#fff; font-weight:600; }
  .hora { font-size:11px; color:#666; }
  .nuevo { animation:flash 1s; }
  @keyframes flash { from { background:#3a3a00; } to { background:transparent; } }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:8px; margin:2px 2px 0 0; }
  .numero{background:#553;} .direccion{background:#355;} .nombre{background:#535;} .fecha{background:#544;}
  .trad .w { cursor:pointer; border-bottom:1px dotted #777; }
  .trad .w:hover, .trad .w.activo { color:#9cf; }
  .pron { color:#7d7; font-style:normal; font-weight:400; }
  /* historial */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:10; }
  .modal-card { background:#1a1a1a; width:min(900px,92vw); height:min(80vh,90vh); border:1px solid #444; border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#000; }
  .modal-body { overflow-y:auto; padding:10px; flex:1; }
  .modal button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:3px 9px; cursor:pointer; }
  .modal button:hover { background:#333; }
  .hist-top { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding:9px 6px; border-bottom:1px solid #2a2a2a; }
  .hist-item .abrir { cursor:pointer; flex:1; }
  .hist-item .abrir:hover { color:#9cf; }
  .solo-lectura { font-size:11px; color:#999; border:1px solid #444; border-radius:8px; padding:1px 6px; }
  .vacio { color:#888; text-align:center; margin-top:40px; }
  /* notas flotantes */
  #notas { display:none; position:fixed; right:16px; bottom:16px; width:300px; height:260px; background:#1a1a1a; border:1px solid #555; border-radius:10px; flex-direction:column; z-index:9; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  #notas .nh { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#000; border-radius:10px 10px 0 0; }
  #notas .nh button { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:2px 8px; cursor:pointer; }
  #notas textarea { flex:1; background:#111; color:#eee; border:none; padding:10px; resize:none; font:14px system-ui,sans-serif; outline:none; border-radius:0 0 10px 10px; }
</style>
</head>
<body>
<header>
  <span class="titulo">Intérprete en vivo</span>
  <button id="btn-cortar" class="cortar" onclick="cortar()" title="Mostrar YA la frase actual (atajo: barra espaciadora)">✂️ Mostrar ya</button>
  <button onclick="limpiar()" title="Archiva la conversación actual en el historial y limpia la pantalla">🧹 Limpiar</button>
  <button onclick="abrirHist()" title="Ver conversaciones guardadas">🕘 Historial</button>
  <button onclick="toggleNotas()" title="Bloc de notas para apuntar nombres/datos">📝 Notas</button>
  <span class="sp"></span>
  <span id="cuota" title="Caracteres DeepL usados este mes"></span>
  <span id="estado">conectando…</span>
</header>
<div class="grid">
  <section class="panel es"><h2>🇪🇸 Cliente (español) — original · interpretación</h2><div class="feed" id="feed-es"></div></section>
  <section class="panel en"><h2>🇺🇸 Representante (inglés) — original · interpretación</h2><div class="feed" id="feed-en"></div></section>
</div>

<div id="notas">
  <div class="nh"><b>📝 Notas</b><span><button onclick="borrarNotas()">🗑 Borrar</button> <button onclick="toggleNotas()">✕</button></span></div>
  <textarea id="notas-txt" placeholder="Apunta aquí nombres y datos para corroborar…"></textarea>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>🕘 Historial de conversaciones</b><button onclick="cerrarHist()">✕</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script>
const KEY = "interprete_historial";
const estado = document.getElementById("estado");
const cuota = document.getElementById("cuota");
const feedEs = document.getElementById("feed-es");
const feedEn = document.getElementById("feed-en");
const modal = document.getElementById("modal");
const modalBody = document.getElementById("modal-body");
let sesion = [];  // intervenciones de la sesión EN VIVO (lo que llega va siempre aquí)
let ws = null;
const pronCache = {};   // palabra(min) -> pronunciación, para no re-pedir
const pendientes = {};  // palabra(min) -> [spans esperando respuesta]

function chips(res){
  return (res||[]).map(r => `<span class="chip ${r.tipo}">${r.texto}</span>`).join("");
}
function clicable(texto){  // envuelve cada palabra para poder pedir su pronunciación
  return texto.replace(/[A-Za-z][A-Za-z']*/g, w => `<span class="w" onclick="pronunciar(this)">${w}</span>`);
}
function rowHTML(iv, bandera){
  const h = (bandera ? (iv.idioma === "es" ? "🇪🇸 " : "🇺🇸 ") : "") + iv.hora;
  // La interpretación al inglés (cuando el original es español) lleva palabras clicables.
  const trad = iv.idioma === "es" ? clicable(iv.traduccion) : iv.traduccion;
  return `<div class="row"><div class="orig"><span class="hora">${h}</span><br>${iv.original}</div>`
       + `<div class="trad">${trad}<br>${chips(iv.resaltados)}</div></div>`;
}
function mostrarPron(el, pron){
  const tag = document.createElement("i");
  tag.className = "pron";
  tag.textContent = pron ? ` "${pron}"` : " (?)";
  el.after(tag);
  el._pron = tag;
}
function pronunciar(el){
  if(el.classList.contains("activo")){  // segundo clic: ocultar
    el.classList.remove("activo");
    if(el._pron){ el._pron.remove(); el._pron = null; }
    return;
  }
  el.classList.add("activo");
  const w = el.textContent.toLowerCase();
  if(w in pronCache){ mostrarPron(el, pronCache[w]); return; }
  (pendientes[w] = pendientes[w] || []).push(el);
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "pron", palabra: el.textContent }));
}
function recibirPron(m){
  const w = (m.palabra || "").toLowerCase();
  pronCache[w] = m.pron;
  (pendientes[w] || []).forEach(el => { if(el.classList.contains("activo") && !el._pron) mostrarPron(el, m.pron); });
  pendientes[w] = [];
}
function add(iv){
  sesion.push(iv);
  const feed = iv.idioma === "es" ? feedEs : feedEn;
  feed.insertAdjacentHTML("beforeend", rowHTML(iv));
  feed.lastElementChild.classList.add("nuevo");
  feed.scrollTop = feed.scrollHeight;
}
function verUso(u){
  if(!u.limit){ cuota.textContent = ""; return; }
  const pct = Math.round(u.count / u.limit * 100);
  cuota.textContent = `DeepL ${u.count.toLocaleString()}/${u.limit.toLocaleString()} (${pct}%)`;
  cuota.style.color = pct >= 90 ? "#f66" : pct >= 70 ? "#fc6" : "#6c6";
}

// --- historial (todo en localStorage; el visor es solo lectura) ---
function cargar(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function guardar(h){ localStorage.setItem(KEY, JSON.stringify(h)); }
function limpiar(){
  if(sesion.length){
    const h = cargar();
    h.unshift({ id: Date.now(), fecha: new Date().toLocaleString("es"), n: sesion.length, ivs: sesion });
    guardar(h);
  }
  sesion = [];
  feedEs.innerHTML = ""; feedEn.innerHTML = "";
}
function abrirHist(){ modal.style.display = "flex"; listaHist(); }
function cerrarHist(){ modal.style.display = "none"; }
function listaHist(){
  const h = cargar();
  if(!h.length){ modalBody.innerHTML = "<p class='vacio'>No hay conversaciones guardadas.</p>"; return; }
  modalBody.innerHTML =
    `<div class="hist-top"><button onclick="borrarTodo()">🗑 Borrar todo</button></div>` +
    h.map(c => `<div class="hist-item"><span class="abrir" onclick="verHist(${c.id})">📄 ${c.fecha} — ${c.n} intervenciones</span>`
             + `<button onclick="borrarUno(${c.id})">🗑</button></div>`).join("");
}
function verHist(id){
  const c = cargar().find(x => x.id === id);
  if(!c) return;
  modalBody.innerHTML =
    `<div class="hist-top"><button onclick="listaHist()">← Volver</button> <b>${c.fecha}</b> <span class="solo-lectura">solo lectura</span></div>`
    + c.ivs.map(iv => rowHTML(iv, true)).join("");
}
function borrarUno(id){ guardar(cargar().filter(x => x.id !== id)); listaHist(); }
function borrarTodo(){ if(confirm("¿Borrar TODO el historial guardado?")){ localStorage.removeItem(KEY); listaHist(); } }

const btnCortar = document.getElementById("btn-cortar");
function cortar(){  // tijera: pide procesar la frase actual ya, sin esperar el silencio
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ tipo: "cortar" }));
  btnCortar.classList.add("flash");
  setTimeout(() => btnCortar.classList.remove("flash"), 200);
}
document.addEventListener("keydown", e => {  // barra espaciadora = tijera
  const escribiendo = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT";
  if(e.code === "Space" && !escribiendo && modal.style.display !== "flex"){ e.preventDefault(); cortar(); }
});

// --- bloc de notas (texto libre, autoguardado en localStorage) ---
const NOTAS_KEY = "interprete_notas";
const notas = document.getElementById("notas");
const notasTxt = document.getElementById("notas-txt");
notasTxt.value = localStorage.getItem(NOTAS_KEY) || "";
notasTxt.addEventListener("input", () => localStorage.setItem(NOTAS_KEY, notasTxt.value));
function toggleNotas(){
  notas.style.display = notas.style.display === "flex" ? "none" : "flex";
  if(notas.style.display === "flex") notasTxt.focus();
}
function borrarNotas(){
  if(confirm("¿Borrar todas las notas?")){ notasTxt.value = ""; localStorage.removeItem(NOTAS_KEY); }
}
function connect(){
  ws = new WebSocket("ws://localhost:8765");
  ws.onopen = () => estado.textContent = "● en vivo";
  ws.onclose = () => { estado.textContent = "desconectado, reintentando…"; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.tipo === "uso") verUso(m);
    else if(m.tipo === "pron") recibirPron(m);
    else add(m);
  };
}
connect();
</script>
</body>
</html>
